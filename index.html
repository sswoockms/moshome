<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My Desktop 편집기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3.2 2.5 11.1a.9.9 0 0 0 1.15 1.38L5 11.36V19a1.8 1.8 0 0 0 1.8 1.8h3.4v-5.4h3.6v5.4h3.4A1.8 1.8 0 0 0 19 19v-7.64l1.35 1.12a.9.9 0 0 0 1.15-1.38Z"/></svg></span>
    <b>My Desktop 편집기</b>
    <span id="saveState" class="save">불러오는 중…</span>
  </div>
  <div class="top-act">
    <button class="btn ghost" id="btnImport" type="button">사이트 불러오기</button>
    <button class="btn primary" id="btnExport" type="button">사이트 내보내기</button>
  </div>
</header>

<main class="split">
  <section class="pv">
    <div class="pv-bar">
      <div class="seg" role="tablist" aria-label="미리보기 크기">
        <button type="button" class="on" data-dev="desktop">데스크톱</button>
        <button type="button" data-dev="mobile">모바일 390px</button>
      </div>
      <button class="btn ghost sm" id="btnReload" type="button">새로고침</button>
      <span class="pv-hint">오른쪽에서 수정한 내용이 왼쪽 미리보기에 바로 반영됩니다.</span>
    </div>
    <div class="pv-body" id="pvBody">
      <iframe id="pv" title="사이트 미리보기"></iframe>
    </div>
  </section>

  <section class="ed">
    <nav class="tabs" id="tabs" role="tablist" aria-label="편집 항목"></nav>
    <div class="panel" id="panel"></div>
  </section>
</main>

<input type="file" id="importFile" accept=".zip,.js,application/zip,text/javascript" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="color-picker.js"></script>
<script src="editor.js"></script>
</body>
</html>
